name: AWS Infrastrcutre Deployment

on:
  push:

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Infrastructure

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::317135987005:role/oidc-role
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Get Redshift Details
        run: |
          echo "redshift_workgroup=$(terraform output -raw redshift_workgroup_name)" >> "$GITHUB_ENV"
          echo "redshift_database=$(terraform output -raw redshift_database_name)" >> "$GITHUB_ENV"
          echo "redshift_secret_arn=$(terraform output -raw redshift_admin_secret_arn)" >> "$GITHUB_ENV"

      - name: Create Bronze Schema
        run: |

          pwd
          ls -l Data_Warehouse/bronze_schema.sql
          cat Data_Warehouse/bronze_schema.sql

          aws redshift-data execute-statement \
            --workgroup-name "$redshift_workgroup" \
            --database "$redshift_database" \
            --secret-arn "$redshift_secret_arn" \
            --sql "$(cat Data_Warehouse/bronze_schema.sql)"
          