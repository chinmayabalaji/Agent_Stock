name: AWS Infrastrcutre Deployment

on:
  push:

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Infrastructure

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
    
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::317135987005:role/oidc-role
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Execute Redshift initialization SQL
        shell: bash
        run: |
          redshift_secret_arn=$(terraform output -raw redshift_admin_secret_arn)

          SQL=$(cat ../Data_Warehouse/init.sql)
      
          aws redshift-data execute-statement \
            --workgroup-name "stock-data-warehouse" \
            --database "stock-data-warehouse" \
            --secret-arn "$redshift_secret_arn" \
            --sql "$SQL"